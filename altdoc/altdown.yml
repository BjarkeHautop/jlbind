# Configuration for altdown::build_site(). See ?altdown::build_site for
# all fields, including `articles:` (navbar order) and `quarto:` (extra
# Quarto settings).

# Groups the function reference index, in the same shape as pkgdown's
# `reference:` field.
reference:
  - title: "Building the library"
    desc: "Compile the Julia code of the installed packages that use jlbind."
    contents:
      - install_library
      - build_library
      - jlbind_clients

  - title: "At run time"
    desc: "Bind a package to the compiled library, and check on it."
    contents:
      - bind_client
      - is_bound
      - library_info

  - title: "Package development"
    desc: "Set up a package to use jlbind."
    contents:
      - use_jlbind
      - update_entrypoints
