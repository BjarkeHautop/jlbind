# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.julia == '' && ' without Julia' || format(' Julia {0}', matrix.config.julia) }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # With Julia, the integration test compiles the test clients in
          # tests/clients into a library and calls them. 1.13 is the minimum
          # supported version; '1' is the latest stable release.
          - {os: ubuntu-latest,   r: 'release', julia: '1'}
          - {os: ubuntu-latest,   r: 'release', julia: '1.13'}
          - {os: windows-latest,  r: 'release', julia: '1.13'}
          - {os: macos-latest,    r: 'release', julia: '1.13'}
          # What CRAN sees: no Julia.
          - {os: ubuntu-latest,   r: 'release', julia: ''}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      JLBIND_TEST_BUILD: ${{ matrix.config.julia != '' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        if: matrix.config.julia != ''
        with:
          version: ${{ matrix.config.julia }}

      - uses: julia-actions/cache@v3
        if: matrix.config.julia != ''

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
