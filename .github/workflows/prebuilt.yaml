# Builds a pruned pre-built library of the test client hellojl with
# build_binary(), installs it with install_library(method = "download") and
# calls it without Julia, on each OS that use_jlbind_binaries()'s workflow
# builds for (tests/testthat/test-prebuilt.R). It runs on pull requests that
# change pre-built libraries, or by hand:
#   gh workflow run prebuilt.yaml --ref <branch>
on:
  workflow_dispatch:
  pull_request:
    paths:
      - R/binaries.R
      - R/download.R
      - inst/julia/build.jl
      - inst/templates/binaries.yaml
      - tests/clients/hellojl/**
      - tests/testthat/test-prebuilt.R
      - tests/testthat/fixtures/prebuilt/**
      - .github/workflows/prebuilt.yaml

name: prebuilt.yaml

permissions: read-all

jobs:
  prebuilt:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      JLBIND_TEST_BINARY: true

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "~1.14.0-0"

      - uses: julia-actions/cache@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat, any::callr
          needs: check

      - name: Build, prune, download and call a pre-built library
        shell: Rscript {0}
        run: |
          testthat::test_local(
            filter = "prebuilt",
            reporter = "progress",
            stop_on_failure = TRUE
          )
