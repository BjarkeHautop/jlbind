# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The integration test compiles the test clients in tests/clients into a
      # library and calls them, covering the build and runtime code.
      JLBIND_TEST_BUILD: true

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "~1.14.0-0"

      - uses: julia-actions/cache@v3

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          flags: r
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

  # JLBind's own tests, run in a Julia session with R embedded by RCall: the
  # compiled library can't record coverage, so the R job covers no Julia code.
  julia-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      # jlbind itself, for the tests of saving references
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          dependencies: '"hard"'

      - uses: julia-actions/setup-julia@v3
        with:
          version: "~1.14.0-0"

      - uses: julia-actions/cache@v3

      # R's own script puts R_HOME/lib on the library path, which the R that
      # RCall embeds skips: without it, R can't load its packages' shared
      # objects at startup, and exits with the error unprinted. The cache
      # restores Conda (RCall's dependency) without the environment its build
      # made, so RCall is built again.
      - name: Set up RCall
        run: |
          echo "LD_LIBRARY_PATH=$(R RHOME)/lib" >> "$GITHUB_ENV"
          julia --project=inst/julia/JLBind -e 'using Pkg; Pkg.instantiate()'
          julia --project=inst/julia/JLBind/test -e 'using Pkg; Pkg.build("RCall")'

      - uses: julia-actions/julia-runtest@v1
        with:
          project: inst/julia/JLBind

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: inst/julia/JLBind/src

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: julia
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
