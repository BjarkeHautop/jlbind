repos:
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.18.0

    hooks:
      - id: panache-format
      - id: panache-lint

  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.13.0
    hooks:
      - id: air-format

  - repo: https://github.com/etiennebacher/jarl-pre-commit
    rev: 1.0.0
    hooks:
      - id: jarl-check

  - repo: local
    hooks:
      - id: needs-roxygenize
        name: roxygen2 documentation is up to date
        entry: >
          Rscript -e 'if (roxygen2::needs_roxygenize())
          stop("Documentation is out of date; run roxygen2::roxygenise()")'
        language: system
        files: '^(R/|DESCRIPTION|NAMESPACE|man/)'
        pass_filenames: false
      - id: jlbind-reference
        name: JLBind reference is up to date
        entry: >
          julia --startup-file=no --project=inst/julia/JLBind
          vignettes/articles/jlbind-reference/build.jl --check
        language: system
        files: '^(inst/julia/JLBind/src/|vignettes/articles/jlbind-reference)'
        pass_filenames: false
      - id: jetls
        name: JETLS finds no problems in JLBind
        # Skipped with a message when JETLS isn't installed.
        entry: >
          Rscript -e 'jetls <- Sys.which("jetls");
          if (!nzchar(jetls)) {
            message("jetls not found; skipping (install JETLS to run this check)")
            quit(status = 0)
          };
          quit(status = system2(jetls, c("check", "inst/julia/JLBind/src/JLBind.jl")))'
        language: system
        files: '^(inst/julia/JLBind/src/|\.JETLSConfig\.toml$)'
        pass_filenames: false
