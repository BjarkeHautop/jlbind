# Generated by jlbind::use_jlbind_binaries().
#
# Builds the pre-built libraries of a release, which users install with
# `jlbind::install_library(method = "download")` without Julia, and attaches
# them to a draft GitHub release v<Version> (from DESCRIPTION). Run it by hand
# (`gh workflow run binaries.yaml`) on the commit to release. On each OS,
# jlbind::build_binary() builds the library, prunes it with
# tools/prune-binary.R if the package has one, and tests it on its own, with
# Julia off the PATH. Then:
#
# 1. jlbind::record_binaries() lists the libraries with their SHA-256 hashes in
#    inst/jlbind/binaries; commit and push that.
# 2. Publish the release on that commit:
#    gh release edit v<Version> --draft=false --target <branch>
on:
  workflow_dispatch:

name: binaries.yaml

permissions: read-all

jobs:
  build:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64, macOS on Apple silicon and Windows x86-64.
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Released JuliaC can't give a library a private Julia runtime on
      # Windows yet; this is JuliaC.jl#151, which can. Remove it once that is
      # released.
      JLBIND_JULIAC: ${{ matrix.os == 'windows-latest' && 'https://github.com/asinghvi17/JuliaC.jl#as/windows-privatize' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "~1.14.0-0"

      - uses: julia-actions/cache@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat, BjarkeHautop/jlbind
          needs: check

      - name: Build, prune and test the library
        shell: Rscript {0}
        run: |
          prune <- "tools/prune-binary.R"
          jlbind::build_binary(
            out = "binary",
            prune = if (file.exists(prune)) prune
          )

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: binary/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binary
          merge-multiple: true

      # A published release is never changed: its libraries are the ones its
      # hashes were recorded from.
      - name: Attach the libraries to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package=$(sed -n 's/^Package: *//p' DESCRIPTION)
          version=$(sed -n 's/^Version: *//p' DESCRIPTION)
          tag="v$version"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published; bump the version."
              exit 1
            fi
            gh release upload "$tag" binary/*.tar.gz --clobber
          else
            gh release create "$tag" binary/*.tar.gz --draft \
              --target "$GITHUB_SHA" --title "$package $version" \
              --notes "Pre-built libraries for \`jlbind::install_library(\"$package\", method = \"download\")\`."
          fi
          sha256sum binary/*.tar.gz
